name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - timer-countdown
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-audio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check Release signing secrets
        id: check_secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          missing=()
          [ -z "${RELEASE_KEYSTORE_BASE64:-}" ] && missing+=("RELEASE_KEYSTORE_BASE64")
          [ -z "${RELEASE_STORE_PASSWORD:-}" ] && missing+=("RELEASE_STORE_PASSWORD")
          [ -z "${RELEASE_KEY_ALIAS:-}" ] && missing+=("RELEASE_KEY_ALIAS")
          [ -z "${RELEASE_KEY_PASSWORD:-}" ] && missing+=("RELEASE_KEY_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            msg="Skipping Release APK build because the following GitHub Secrets are not configured: ${missing[*]}"
            echo "$msg"
            echo "### Release APK Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "All four Release signing secrets are present."
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Set up Java
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode and inspect Release keystore
        if: steps.check_secrets.outputs.has_secrets == 'true'
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set +x
          set -euo pipefail

          KEYSTORE_TMP="${RUNNER_TEMP}/quran-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_TMP"

          if [ ! -s "$KEYSTORE_TMP" ]; then
            echo "Decoded keystore file is empty." >&2
            exit 1
          fi

          KEYTOOL_OUT="$(LC_ALL=C keytool -list -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_TMP" \
            -alias "$RELEASE_KEY_ALIAS" \
            -storepass:env RELEASE_STORE_PASSWORD)"

          KEY_SHA256="$(printf '%s\n' "$KEYTOOL_OUT" | grep -iE '^[[:space:]]*SHA256:' | head -n 1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256="39d433f3756893effde472d8a57302d1d731cfee858c8d98809fe0fc4cab99c2"

          if [ -z "$KEY_SHA256" ] || [ "$KEY_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Keystore SHA-256 fingerprint mismatch. Expected $EXPECTED_SHA256, got ${KEY_SHA256:-empty}." >&2
            exit 1
          fi

          echo "Keystore pre-check passed (PKCS12, matching SHA-256)."
          echo "KEYSTORE_PATH=${KEYSTORE_TMP}" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_TYPE: PKCS12
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify Release APK signature and metadata
        if: steps.check_secrets.outputs.has_secrets == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Release APK not found at $APK_PATH" >&2
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "Android SDK build-tools directory not found (ANDROID_HOME/ANDROID_SDK_ROOT unset)." >&2
            exit 1
          fi

          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "No Android SDK build-tools version found under $SDK_ROOT/build-tools." >&2
            exit 1
          fi

          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"

          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found or not executable at $APKSIGNER" >&2
            exit 1
          fi
          if [ ! -x "$AAPT2" ]; then
            echo "aapt2 not found or not executable at $AAPT2" >&2
            exit 1
          fi

          echo "Using build-tools: $BUILD_TOOLS_DIR"
          VERIFY_OUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$VERIFY_OUT"

          APK_SHA256="$(printf '%s\n' "$VERIFY_OUT" | grep -i 'Signer #1 certificate SHA-256 digest:' | head -n 1 | awk -F': ' '{print $2}' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256="39d433f3756893effde472d8a57302d1d731cfee858c8d98809fe0fc4cab99c2"

          if [ -z "$APK_SHA256" ] || [ "$APK_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "APK SHA-256 signature mismatch! Expected $EXPECTED_SHA256, got ${APK_SHA256:-empty}." >&2
            exit 1
          fi

          BADGING_OUT="$("$AAPT2" dump badging "$APK_PATH")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING_OUT" | grep -E '^package:' | head -n 1)"
          echo "$PACKAGE_LINE"

          printf '%s\n' "$PACKAGE_LINE" | grep -q "name='com.aistudio.quranaudio.yqtzlm'"
          printf '%s\n' "$PACKAGE_LINE" | grep -q "versionCode='1'"
          printf '%s\n' "$PACKAGE_LINE" | grep -q "versionName='1.0'"

          echo "Verified Release APK: signature SHA-256, applicationId, versionCode, and versionName all match."

      - name: Clean up temporary Release keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/quran-release.jks"

      - name: Upload Release APK
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quran-audio-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
